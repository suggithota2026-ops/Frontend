<head>

  <link rel="icon" type="image/png" href="./favicon.ico" />
  <meta name="description"
    content="Suggi Thota connects local farms with your home, delivering fresh, organic vegetables every day." />

  <meta property="og:title" content="Suggi Thota – Fresh Vegetables Delivered Daily" />

  <!-- Preload critical fonts (self-hosted) -->
  <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Preload only the current page's LCP hero -->
  <script>
    (function () {
      var path = location.pathname || "/";
      var href =
        path === "/" || path === ""
          ? "/close-up-dairy-products-optimized-1024w.webp"
          : path.indexOf("/about") === 0
            ? "/healthy-vegetables-wooden-table-optimized-1024w.webp"
            : path.indexOf("/contact") === 0
              ? "/top-view-tasty-fruits-arrangement-optimized-1024w.webp"
              : null;
      if (!href) return;
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.href = href;
      link.fetchPriority = "high";
      link.type = "image/webp";
      document.head.appendChild(link);
    })();
  </script>

  <link rel="dns-prefetch" href="https://play.google.com" />
</head>
